<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eliza – MovMore Clinic Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="chat-wrapper">
    <!-- Botão flutuante -->
    <button class="chat-bubble-btn" id="openBtn" aria-label="Open Eliza Assistant">🪷</button>

    <!-- Janela do chat -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <div class="chat-avatar">E</div>
        <div class="chat-header-text">
          <h3 id="chatTitle">Eliza – MovMore Clinic</h3>
          <p id="chatSubtitle">Your 24/7 aesthetic clinic concierge.</p>
        </div>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-footer">
        <input id="chatInput" class="chat-input" type="text" placeholder="Type your message..." />
        <button id="chatSend" class="chat-send">Send</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
